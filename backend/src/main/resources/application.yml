server:
  port: ${PORT:5000}

spring:
  application:
    name: tourguide-backend
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://${DB_SERVER:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:TourGuideDB};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:YourStrong@Passw0rd}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      idle-timeout: 30000

app:
  jwt:
    secret: ${JWT_SECRET:change_this_to_a_long_random_string}
    expires-in: ${JWT_EXPIRES_IN:7d}
  cors:
    client-origin: ${CLIENT_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
